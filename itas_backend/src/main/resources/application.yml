server:
  port: ${SERVER_PORT}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH}

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:public}
        format_sql: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:100MB}
      file-size-threshold: ${SPRING_SERVLET_MULTIPART_FILE_SIZE_THRESHOLD:2KB}

  web:
    resources:
      add-mappings: true
      static-locations: ${SPRING_WEB_RESOURCES_STATIC_LOCATIONS:file:uploads/,classpath:/static/}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED:true}

app:
  frontend-url: ${APP_FRONTEND_URL}
  upload-dir: ${APP_UPLOAD_DIR}
  sso:
    enabled: ${SSO_ENABLED:false}
    provider-url: ${SSO_PROVIDER_URL:https://sso.itas.gov.et/auth}
    client-id: ${SSO_CLIENT_ID:itas-portal}
    callback-url: ${FRONTEND_URL:http://localhost:3000}/auth/sso/callback

  email:
    enabled: ${APP_EMAIL_ENABLED}
    from: ${APP_EMAIL_FROM:${SPRING_MAIL_USERNAME}}
    from-name: ${APP_EMAIL_FROM_NAME}

  jwt:
    secret: ${APP_JWT_SECRET:${JWT_SECRET:U3ByaW5nQm9vdDNKYXZhMjVKd3RTZWNyZXRLZXlGb3JQb3J0YWxMbXNfU3VwZXJTZWN1cmVfMjAyNg==}}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:${JWT_EXPIRATION_MS:86400000}}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:your-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}
  enabled: ${CLOUDINARY_ENABLED:true}
  folder: ${CLOUDINARY_FOLDER:itas-portal}
