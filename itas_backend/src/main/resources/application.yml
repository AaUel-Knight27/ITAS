server:
  port: 8080
  servlet:
    context-path: /api/v1

app:
  upload-dir: uploads

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/portal_db?currentSchema=public
    username: postgres
    password: Kangrro@123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 2KB
  web:
    resources:
      static-locations: file:uploads/,classpath:/static/
      add-mappings: true

