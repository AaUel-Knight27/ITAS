server:
  port: 8082
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: optional:file:.env[.properties]
  application:
    name: itas-course-service
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portal_db}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:yourpassword}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: course_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: course_schema
    schemas: course_schema

app:
  upload-dir: ${UPLOAD_DIR:${APP_UPLOAD_DIR:uploads}}
  frontend-url: ${FRONTEND_URL:${APP_FRONTEND_URL:http://localhost:3000}}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:your-cloud-name}
  api-key: ${CLOUDINARY_API_KEY:your-api-key}
  api-secret: ${CLOUDINARY_API_SECRET:your-api-secret}
  enabled: ${CLOUDINARY_ENABLED:true}
  folder: ${CLOUDINARY_FOLDER:itas-portal}

services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  learning-url: ${LEARNING_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
