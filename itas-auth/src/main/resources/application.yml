server:
  port: 8081
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    import: optional:file:.env[.properties]
  application:
    name: itas-auth-service
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portal_db}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:yourpassword}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 600000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: auth_schema
    schemas: auth_schema

app:
  jwt:
    secret: ${JWT_SECRET:${APP_JWT_SECRET:itas-dev-secret-change-in-production-minimum-32-chars}}
    expiration-ms: ${JWT_EXPIRATION_MS:${APP_JWT_EXPIRATION_MS:86400000}}
  email:
    from: ${GMAIL_USERNAME:${APP_EMAIL_FROM:noreply@itas.gov.et}}
  frontend-url: ${FRONTEND_URL:${APP_FRONTEND_URL:http://localhost:3000}}
  sso:
    enabled: ${SSO_ENABLED:false}
    provider-url: ${SSO_PROVIDER_URL:https://sso.itas.gov.et/auth}
    client-id: ${SSO_CLIENT_ID:itas-portal}
    callback-url: ${FRONTEND_URL:${APP_FRONTEND_URL:http://localhost:3000}}/auth/sso/callback

management:
  endpoints:
    web:
      exposure:
        include: health,info
