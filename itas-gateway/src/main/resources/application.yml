server:
  port: 8080
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

app:
  jwt:
    secret: ${JWT_SECRET:itas-dev-secret-change-in-production-minimum-32-chars}

  services:
    auth: ${AUTH_SERVICE_URL:http://localhost:8081}
    course: ${COURSE_SERVICE_URL:http://localhost:8082}
    learning: ${LEARNING_SERVICE_URL:http://localhost:8083}
    webinar: ${WEBINAR_SERVICE_URL:http://localhost:8084}
    notify: ${NOTIFY_SERVICE_URL:http://localhost:8085}
    admin: ${ADMIN_SERVICE_URL:http://localhost:8086}

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "${FRONTEND_URL:http://localhost:3000}"
            allowed-methods: [GET, POST, PUT, DELETE, PATCH, OPTIONS]
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

      routes:
        - id: auth-routes
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

        - id: public-verify
          uri: ${LEARNING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/verify/**
          filters:
            - StripPrefix=2

        - id: public-uploads
          uri: ${COURSE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/uploads/**
          filters:
            - StripPrefix=2

        - id: course-service
          uri: ${COURSE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/courses/**, /api/v1/search/**
          filters:
            - StripPrefix=2
            - name: JwtAuthFilter

        - id: learning-service
          uri: ${LEARNING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/lms/**, /api/v1/content/**
          filters:
            - StripPrefix=2
            - name: JwtAuthFilter

        - id: webinar-service
          uri: ${WEBINAR_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/webinars/**
          filters:
            - StripPrefix=2
            - name: JwtAuthFilter

        - id: notification-service
          uri: ${NOTIFY_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/notifications/**, /api/v1/announcements/**, /api/v1/faq/**, /api/v1/help/**
          filters:
            - StripPrefix=2
            - name: JwtAuthFilter

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/admin/**, /api/v1/analytics/**
          filters:
            - StripPrefix=2
            - name: JwtAuthFilter

management:
  endpoints:
    web:
      exposure:
        include: health,info
