server:
  port: 8083

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: itas-learning-service
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portal_db}}
    username: ${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:yourpassword}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: learning_schema
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: learning_schema
    schemas: learning_schema
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:${APP_EMAIL_FROM:noreply@itas.gov.et}}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false

app:
  frontend-url: ${FRONTEND_URL:${APP_FRONTEND_URL:http://localhost:3000}}
  upload-dir: ${UPLOAD_DIR:${APP_UPLOAD_DIR:uploads}}
  email:
    from: ${GMAIL_USERNAME:${APP_EMAIL_FROM:noreply@itas.gov.et}}
    from-name: "ITAS Portal"
    enabled: ${EMAIL_ENABLED:true}

services:
  auth-url: ${AUTH_SERVICE_URL:http://localhost:8081}
  course-url: ${COURSE_SERVICE_URL:http://localhost:8082}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
